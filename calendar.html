<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Navigation -->
        <nav>

            <div class="logo">📝 To-Do List</div>

            <div class="nav-links">
                <a href="index.html">Tasks</a>
                <a href="calendar.html" class="active">📅 Calendar</a>
            </div>

        </nav>

        <main>

            <div class="heading">
                <div>
                    <h1>Task Calendar</h1>
                    <p>Click a date to see completed tasks.</p>
                </div>

                <span class="dashboard-badge">
                    ✓ Available in Dashboard Insights
                </span>
            </div>

            <!-- Calendar -->
            <div class="calendar-box">

                <div class="calendar-header">

                    <button id="prevMonth" class="month-btn">
                        ←
                    </button>

                    <h2 id="monthYear"></h2>

                    <button id="nextMonth" class="month-btn">
                        →
                    </button>

                </div>

                <!-- Week Days -->
                <div class="weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>

                <!-- Calendar Days -->
                <div id="calendarDays" class="calendar-days"></div>

            </div>

            <!-- Selected Date -->
            <div class="completed-section">

                <h2 id="selectedDate">
                    Select a date
                </h2>

                <div id="completedTasksList">

                    <p class="empty-message">
                        Click a date on the calendar to view completed tasks.
                    </p>

                </div>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
